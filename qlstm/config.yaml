# Project-wide configuration
data:
  cache_dir: "./data_cache"

features:
  default:
    - Open
    - High
    - Low
    - Close
    - Volume
    - SMA_10
    - SMA_50
    - EMA_10
    - EMA_50
    - MACD
    - RSI
    - Bollinger_upper
    - Bollinger_lower
    - ATR

training:
  window_size: 60
  batch_size: 8
  epochs: 50
  lr: 0.001
  test_ratio: 0.2
  seed: 42

model:
  type: "GRU" # options: LSTM, GRU, AttentionGRU, AttentionLSTM
  input_dim: null  # auto-detected after preprocessing
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  output_dim: 1
  use_quantum: False   # <--- toggle to true for quantum experiments

forecast:
  horizon: 10  # number of steps to forecast iteratively
